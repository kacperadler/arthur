name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # npm test in 4 shards at once, each a quarter of its files as node --test splits them; npm run check in the first.
  test:
    name: test ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.shard == 1
        run: npm run check
      # package.json's test script, its globs written here too, with --test-shard before them: after them node ignores it, and in
      # NODE_OPTIONS it would reach every node --test a test starts. The spec reporter for the log; test/github-annotations.ts turns
      # each failed test into an `::error` annotation, readable without a token.
      - run: node --import @arthur/core/testing --test --test-shard=${{ matrix.shard }}/4 "test/**/*.test.ts" "packages/*/test/**/*.test.ts"
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=${{ github.workspace }}/test/github-annotations.ts --test-reporter-destination=stdout
  # The one job that passes only once every shard did; a shard that fails skips it, and the run fails.
  check:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - run: echo "every shard of npm test passed"
